[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-verified-dev-crew"
version = "0.1.0"
description = "Project 21: Sequential 4-agent CrewAI engineering team with interface contracts, isolated sandboxes, path-traversal guards, and independent acceptance tests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Pranil Deshmukh" }
]
dependencies = [
  "pydantic>=2.6.0",
  "crewai>=0.80.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[project.scripts]
dev-crew-demo = "dev_crew.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["dev_crew*"]
